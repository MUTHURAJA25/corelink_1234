name: Gitea Checkout Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: mxk_1025/corelink_1234
          token: ${{ secrets.CHECKOUT_TOKEN }}
          fetch-depth: 1

      - name: Verify
        run: |
          echo "CHECKOUT SUCCESS"
          git status
          git log -1 --oneline
