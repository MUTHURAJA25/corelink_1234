name: Gitea Checkout Test

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Gitea Checkout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
  env:
    GITEA_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
  run: |
    set -e

    echo "Cloning Corelink repository..."

    git clone \
      --depth 1 \
      --branch main \
      "http://mxk_1025:${GITEA_TOKEN}@gitea:3000/mxk_1025/corelink_1234.git" \
      .

    echo "CHECKOUT SUCCESS"
