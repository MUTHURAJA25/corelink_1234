name: Gitea Checkout Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: mxk_1025/corelink_1234
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Verify Checkout
        run: |
          echo "Checkout successful"
          ls -la
          git status
