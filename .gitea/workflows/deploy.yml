name: Gitea Network Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Gitea DNS
        run: |
          echo "=== DNS TEST ==="
          getent hosts gitea

          echo "=== GITEA TEST ==="
          wget -S -O /dev/null http://gitea:3000/ 2>&1

          echo "=== NETWORK TEST COMPLETE ==="
