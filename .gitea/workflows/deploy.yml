name: Gitea Checkout Test

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Gitea Checkout
    runs-on: ubuntu-latest

    steps:
      - name: Check Environment
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Server: $GITHUB_SERVER_URL"
          echo "Workspace: $GITHUB_WORKSPACE"
          getent hosts gitea || true
          echo "Testing Gitea connection..."
          wget -S -O /dev/null http://gitea:3000/ 2>&1 || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: mxk_1025/corelink_1234
          token: ${{ secrets.CHECKOUT_TOKEN }}
          fetch-depth: 1

      - name: Verify Checkout
        run: |
          echo "CHECKOUT SUCCESS"
          git status
          git log -1 --oneline
          ls -la
