name: Corelink CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # ==========================================================
  # STAGE 1 - INSTALL
  # ==========================================================
  install:
    name: "Stage 1 - Install Dependencies"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Install Backend Dependencies
        run: |
          npm --prefix server ci


  # ==========================================================
  # STAGE 2 - BUILD
  # ==========================================================
  build:
    name: "Stage 2 - Build"
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix server ci

      - name: Build React Application
        run: |
          npm run build

      - name: Verify Build
        run: |
          test -d dist
          echo "Frontend build successful"


  # ==========================================================
  # STAGE 3 - SONARQUBE
  # ==========================================================
  sonarqube:
    name: "Stage 3 - SonarQube"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "=========================================="
          echo "Starting SonarQube Analysis"
          echo "=========================================="

          npm install -g sonar-scanner

          sonar-scanner \
            -Dsonar.projectKey=corelink \
            -Dsonar.projectName=Corelink \
            -Dsonar.sources=. \
            -Dsonar.exclusions=node_modules/**,dist/**,server/node_modules/** \
            -Dsonar.host.url=http://sonarqube:9000 \
            -Dsonar.token="$SONAR_TOKEN"

          echo "SonarQube Analysis Completed"


  # ==========================================================
  # STAGE 4 - DEPLOY
  # ==========================================================
  deploy:
    name: "Stage 4 - Deploy"
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Build Frontend
        run: |
          npm run build

      - name: Deploy Application
        run: |

          set -e

          echo "=========================================="
          echo "Starting Corelink Deployment"
          echo "=========================================="

          APP_DIR="/home/ubuntu/corelink"
          WEB_DIR="/var/www/corelink"

          sudo mkdir -p "$APP_DIR"
          sudo mkdir -p "$WEB_DIR"

          echo "Copying application files..."

          sudo rsync -a \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=.git \
            --exclude=.env \
            --exclude=server/.env \
            ./ "$APP_DIR/"

          cd "$APP_DIR"

          echo "Installing backend dependencies..."

          sudo npm ci --omit=dev
          sudo npm --prefix server ci --omit=dev

          if [ ! -f "$APP_DIR/server/.env" ]; then
            echo "ERROR: server/.env does not exist"
            exit 1
          fi

          if ! command -v pm2 >/dev/null 2>&1; then
            echo "Installing PM2..."
            sudo npm install -g pm2
          fi

          echo "Stopping existing Corelink API..."

          pm2 delete corelink-api || true

          echo "Starting Corelink API..."

          pm2 start "$APP_DIR/server/index.js" \
            --name corelink-api

          pm2 save

          echo "Deploying frontend..."

          sudo rm -rf "$WEB_DIR"/*
          sudo cp -r "$GITHUB_WORKSPACE/dist/"* "$WEB_DIR/"

          echo "Testing Nginx..."

          sudo nginx -t

          echo "Reloading Nginx..."

          sudo systemctl reload nginx

          echo "=========================================="
          echo "Deployment Completed Successfully"
          echo "=========================================="


  # ==========================================================
  # STAGE 5 - HEALTH CHECK
  # ==========================================================
  health-check:
    name: "Stage 5 - Health Check"
    runs-on: ubuntu-latest
    needs: deploy

    steps:

      - name: Check PM2
        run: |
          echo "Checking Corelink PM2 process..."
          pm2 status corelink-api

      - name: Check Backend API
        run: |
          echo "Checking backend API..."

          curl -f http://localhost:8086/api/health

          echo "Backend health check passed."

      - name: Check Nginx
        run: |
          echo "Checking Nginx..."

          systemctl is-active --quiet nginx

          echo "Nginx health check passed."

      - name: Check Frontend
        run: |
          echo "Checking frontend..."

          curl -f http://localhost/

          echo "Frontend health check passed."

      - name: Deployment Health Check Successful
        run: |
          echo ""
          echo "=========================================="
          echo "        HEALTH CHECK PASSED"
          echo "=========================================="
          echo ""
          echo "Corelink Application is UP"
          echo ""
          echo "Frontend : http://localhost/"
          echo "Backend  : http://localhost:8086"
          echo "Health   : http://localhost:8086/api/health"
          echo "SonarQube: http://localhost:9000"
          echo ""
          echo "=========================================="
