name: Gitea Checkout Test

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Checkout Test
    runs-on: ubuntu-latest

    steps:
      - name: Check Token
        env:
          ACTIONS_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          if [ -n "$ACTIONS_TOKEN" ]; then
            echo "GITEA_TOKEN is available"
          else
            echo "GITEA_TOKEN is NOT available"
          fi

      - name: Checkout
        uses: actions/checkout@v4
